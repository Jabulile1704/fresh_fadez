name: fresh_fadez
description: Fresh Fadez — a salon booking app for clients and staff, built with Flutter.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.2
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  intl: ^0.20.3
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
